  - { id: small,   node: mac-mini-m1, port: 9002, source: local, engine: metal, type: chat,      file: "Qwen3.5-2B-Q4_K_M.gguf",                 context: 8192,  compute: gpu, provenance: configured }
  - { id: embed,   node: mac-mini-m1, port: 9003, source: local, engine: metal, type: embedding, file: "bge-m3-Q4_K_M.gguf",                      context: 512,   compute: gpu, provenance: configured }
  - { id: coder,   node: mac-mini-m1, port: 9004, source: local, engine: metal, type: chat,      file: "Qwen2.5-Coder-3B-Instruct-Q4_K_M.gguf",  context: 16384, compute: gpu, provenance: configured }
  - { id: fast,    node: mac-mini-m1, port: 9005, source: local, engine: metal, type: chat,      file: "Qwen3-1.7B-Q4_K_M.gguf",                 context: 8192,  compute: gpu, provenance: configured }
  - { id: multi,   node: mac-mini-m1, port: 9006, source: local, engine: metal, type: chat,      file: "gemma-3n-E2B-it-Q4_K_M.gguf",            context: 8192,  compute: gpu, provenance: configured, caps: [vision] }
