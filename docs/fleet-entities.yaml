# ── Routes (high-level logical) ──
routes:
  - { id: chat-local, label: "Local chat (local-first)", flow: "client → jart-ura:9100 → llama-server :9001-9006", via: [http-mgmt, http-openai], provenance: configured }
  - { id: chat-cloud, label: "Cloud fallback", flow: "client → jart-ura:9100 → API proxy :9010-9012 → provider", via: [http-mgmt, http-openai], provenance: "configured(gpt-4o)+documented" }
  - { id: mesh-peer,  label: "Mesh sync", flow: "jart-ura → peer :9100/v1/models over Tailscale (15s)", via: [wireguard, http-mgmt], provenance: configured }
  - { id: voice,      label: "Voice pipeline", flow: "browser → WebRTC → livekit(vps) → VAD → STT → LLM → TTS → WebRTC", via: [webrtc, websocket, http-openai], provenance: "documented+observed(livekit)" }
  - { id: monitoring, label: "Telemetry", flow: "prometheus(vps) scrapes exporters → grafana", via: [http-web], provenance: observed }

# ── Datapaths: the PHYSICAL hop sequence each request travels (what the camera
#    illuminates piece by piece: cable → NIC → process → RAM → GPU/ANE → back) ──
datapaths:
  - id: dp-chat-local-lan
    of_route: chat-local
    provenance: "configured + hardware-spec(compute)"
    hops:
      - "client/nic"
      - "transport:lan-home (ethernet or wifi)"
      - "home-router"
      - "mac-mini-m1/en0 (ethernet, active)"
      - "mac-mini-m1/lo0 (kernel loopback)"
      - "process:jart-ura :9100"
      - "process:llama-server :900x"
      - "mac-mini-m1/nvme (read model weights)"
      - "mac-mini-m1/ram (unified, weights resident)"
      - "mac-mini-m1/gpu (Metal compute, gpu_layers=99)"
      - "mac-mini-m1/ram → process → en0 → client (response)"
  - id: dp-chat-local-remote
    of_route: chat-local
    provenance: configured
    hops:
      - "client/nic"
      - "transport:tailscale-overlay (WireGuard, UDP/41641 over WAN)"
      - "mac-mini-m1/utun5 (tailscale)"
      - "process:jart-ura :9100 → llama-server :900x"
      - "mac-mini-m1/nvme → ram → gpu (Metal) → back"
  - id: dp-chat-cloud
    of_route: chat-cloud
    provenance: "configured(gpt-4o)"
    hops:
      - "client → mac-mini-m1/en0"
      - "process:jart-ura :9100 → API proxy :9010"
      - "mac-mini-m1/en0 → transport:wan-internet"
      - "provider:api.openai.com → response back"
  - id: dp-mesh-peer
    of_route: mesh-peer
    provenance: configured
    hops:
      - "mac-mini-m1/process:jart-ura"
      - "mac-mini-m1/utun5 → transport:tailscale-overlay"
      - "peer/tailscale0 → peer/process:jart-ura :9100/v1/models"
  - id: dp-voice
    of_route: voice
    provenance: "documented + observed(livekit live)"
    hops:
      - "client/mic → client/nic"
      - "transport:wan-internet (or lan-home)"
      - "vps-ionos/ens6"
      - "transport:vps-docker-net (bridge → container)"
      - "vps-ionos/livekit :7881 + WebRTC udp 50000-50100 (Opus)"
      - "VAD (Silero) → STT"
      - "transport:tailscale-overlay → mac-mini-m1/utun5"
      - "mac-mini-m1/ane (whisper STT via CoreML) or cpu"
      - "process:jart-ura → mac-mini-m1/gpu (LLM, Metal)"
      - "mac-mini-m1/ane (Kokoro TTS via CoreML)"
      - "back → tailscale → vps livekit → WebRTC → client/speaker"

# ── State model the dashboard reflects (REAL state, never mock) ──
states:
  model: [running, degraded, failed, stopped]   # per model, from /v1/registry
  node: [online, idle, offline]                  # per node, from tailscale/health
  connection: [connecting, live, offline]        # dashboard ↔ /v1/registry feed
