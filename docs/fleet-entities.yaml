# Real fleet entity-relationship map for JART-URA — the data substrate the
# cinematic dashboard renders. Generated 2026-06-15.
#
# PROVENANCE per entity (this is what makes it real, not a mock):
#   observed       — seen in a node snapshot (Jart-UP/_snapshots/*, 2026-06-11)
#   configured     — declared in Jart-URA/config/models.json
#   documented     — ARCHITECTURE.md target design (NOT confirmed deployed)
#   hardware-spec  — known from the chip/SKU (e.g. Apple M1); confirm exact counts
# EXCLUDED: dashboard/src/data/fleet.js (MOCK) — none of its values are used.
#
# This file now models THREE depths so the camera can zoom piece by piece:
#   1. machines        (nodes)
#   2. components       (cpu/gpu/ane/ram/nvme/NICs/buses inside each machine)
#   3. transports + datapaths (the cable/wifi/tunnel links and the physical hop
#                              sequence each request travels through)
# Live status/metrics come from /v1/registry + health probes at runtime.

meta:
  generated: "2026-06-15"
  sources:
    observed: "Jart-UP/_snapshots/macmini-20260611, vps1-ionos-20260611"
    configured: "Jart-URA/config/models.json"
    documented: "Jart-URA/ARCHITECTURE.md"
  excluded_mock: "Jart-URA/dashboard/src/data/fleet.js"
  open_discrepancies:
    - "ARCHITECTURE names a 'VPS Contabo 24GB' with LiteLLM(:10280)/Qdrant/FRONTIER(:4400);
       the OBSERVED VPS is ionos (82.223.64.198, 23Gi RAM ~ 24GB) running
       Jart-OS-remote-server (LiveKit/NATS/Authentik/monitoring) — none of those
       three present. Size matches; name/services differ. Confirm."
    - "Mac mini snapshot shows NO llama-server on 9001-9006 and NO :9100 listening
       at capture → models are 'configured', not 'observed running'."

# ── Normalized component taxonomy (Rubén: 'normalizar todo') ──
component_types:
  compute: [cpu, gpu, ane, vcpu]
  memory: [unified-ram, ram]
  storage: [nvme, virtual-disk]
  io: [nic-ethernet, nic-wifi, loopback, vpn-tunnel, docker-bridge]
  bus: [unified-memory, nvme-link, pcie-thunderbolt, virtio]

# ── Protocols / channels (coloured flows; UX picks the final neon palette) ──
protocols:
  - { id: http-openai, label: "HTTP · OpenAI spec", ports: ["9001-9012"], accent: cyan }
  - { id: http-mgmt,   label: "HTTP · Jart-URA mgmt", ports: ["9100"], accent: cyan }
  - { id: http-web,    label: "HTTP · web UI / API", ports: ["10001-16002"], accent: teal }
  - { id: websocket,   label: "WebSocket (LiveKit)", ports: ["7881"], accent: violet }
  - { id: webrtc,      label: "WebRTC · Opus", ports: ["443/udp", "50000-50100/udp", "5349"], accent: magenta }
  - { id: wireguard,   label: "Tailscale · WireGuard", ports: ["41641/udp"], accent: green }
  - { id: nats,        label: "NATS", ports: ["4222", "8222"], accent: amber }
  - { id: redis,       label: "Redis", ports: ["6379"], accent: red }
  - { id: postgres,    label: "PostgreSQL", ports: ["5432"], accent: blue }
  - { id: ssh,         label: "SSH", ports: ["22"], accent: slate }

# ── Transports / physical+logical links (the cables, wifi, tunnels) ──
transports:
  - id: lan-home
    medium: "copper Ethernet + Wi-Fi (802.11)"
    subnet: "192.168.1.0/24"
    members: ["mac-mini-m1/en0 (ethernet, active)", "macbook-pro-m1max (192.168.1.44)"]
    provenance: observed
  - id: wan-internet
    medium: "public internet"
    reaches: ["vps-ionos (82.223.64.198)", "cloud-apis (openai/anthropic/openrouter)"]
    provenance: observed
  - id: tailscale-overlay
    medium: "WireGuard, UDP/41641 (encrypted mesh over LAN/WAN)"
    subnet: "100.x (MagicDNS)"
    members: ["mac-mini-m1 100.77.1.20", "macbook-pro 100.77.1.30", "vps-ionos 100.77.1.10", "remote-server-2 100.118.124.101", "pixel/samsung/xiaomi"]
    provenance: observed
  - id: vps-docker-net
    medium: "virtual bridges (172.18-28.x) + veth pairs"
    note: "proxy ↔ container and container ↔ container inside the VPS"
    provenance: observed

