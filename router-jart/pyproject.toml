[project]
name = "router-jart"
version = "0.1.0"
description = "Jart-URA Data Plane — memory enrichment + model-routing passthrough"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["src/enrichment/tests", "src/routing/tests"]
asyncio_mode = "auto"
pythonpath = ["."]
