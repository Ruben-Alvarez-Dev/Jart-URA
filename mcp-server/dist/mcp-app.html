<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Jart-URA Dashboard</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --green: #3fb950;
      --red: #f85149;
      --blue: #58a6ff;
      --orange: #d29922;
      --accent: #2f81f7;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 14px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
    }

    .title-sub {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 400;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #21262d;
    }

    .btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.green { background: var(--green); }
    .dot.red { background: var(--red); }
    .dot.orange { background: var(--orange); }

    /* Summary cards */
    .summary {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      flex: 1;
    }

    .card-value {
      font-size: 24px;
      font-weight: 700;
    }

    .card-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card.green .card-value { color: var(--green); }
    .card.red .card-value { color: var(--red); }
    .card.blue .card-value { color: var(--blue); }

    /* Model table */
    .table {
      width: 100%;
      border-collapse: collapse;
    }

    .table th {
      text-align: left;
      padding: 8px 12px;
      font-size: 12px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      font-weight: 500;
    }

    .table td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .table tr:hover td {
      background: rgba(255,255,255,0.03);
    }

    .model-name {
      font-weight: 500;
    }

    .model-name small {
      color: var(--text-muted);
      font-weight: 400;
      font-size: 12px;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 500;
    }

    .tag.local {
      background: rgba(88, 166, 255, 0.15);
      color: var(--blue);
    }

    .tag.api {
      background: rgba(210, 153, 34, 0.15);
      color: var(--orange);
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .error-state {
      text-align: center;
      padding: 40px;
      color: var(--red);
    }

    /* Status bar */
    .status-bar {
      margin-top: 12px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
  <script type="module" crossorigin src="/assets/mcp-app-SQh-sy0o.js"></script>
</head>
<body>
  <header class="header">
    <div>
      <div class="title">Jart-URA <span class="title-sub">Dashboard</span></div>
    </div>
    <div class="controls">
      <button id="poll-btn" class="btn">Start Polling</button>
      <span class="status-badge">
        <span id="status-dot" class="dot green"></span>
        <span id="status-text">Ready</span>
      </span>
    </div>
  </header>

  <div class="summary">
    <div class="card blue">
      <div class="card-value" id="total-models">--</div>
      <div class="card-label">Total Models</div>
    </div>
    <div class="card green">
      <div class="card-value" id="running-models">--</div>
      <div class="card-label">Running</div>
    </div>
    <div class="card red">
      <div class="card-value" id="failed-models">--</div>
      <div class="card-label">Failed</div>
    </div>
  </div>

  <table class="table">
    <thead>
      <tr>
        <th>Status</th>
        <th>Name</th>
        <th>Type</th>
        <th>Port</th>
        <th>Provider</th>
      </tr>
    </thead>
    <tbody id="models-body">
      <tr><td colspan="5" class="empty">Loading...</td></tr>
    </tbody>
  </table>

  <div id="status-bar" class="status-bar">Connected to Jart-URA</div>

</body>
</html>
